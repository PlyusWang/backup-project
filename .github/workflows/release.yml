# Release packages —— 在旧基线的干净容器里构建两个可以发给真实用户的产品族，
# 并在干净机器上做安装 / 升级 / 卸载验收。
#
# 为什么必须在旧基线容器里构建：开发机是 Ubuntu 24.04（glibc 2.39），生产 ECS 是
# Ubuntu 22.04（glibc 2.35）。直接用开发机的二进制上去会因为 "GLIBC_2.38 not
# found" 起不来（PR #20 真实踩过一次）。
#
# 基线（证据见 docs/release-packaging.md）：
#   server: ubuntu:20.04 -> glibc 2.31，无 Qt 依赖
#   client: debian:12    -> glibc 2.36 + Qt 6.4.2
#     客户端 GUI 使用 QtQuick.Dialogs 的 FolderDialog（Since: Qt 6.3），
#     Ubuntu 22.04 只有 Qt 6.2.4，所以 22.04 不能作为客户端构建基线。
#
# 本 workflow **不创建 tag、不发布 GitHub Release**：tag 触发只是把设计留在这里
# （v*），正式发布必须等人工 review。第三方 Action 一律 pin 到 commit SHA。
#
# 开发期触发：特性分支上的 push。GitHub 只允许 dispatch 默认分支上的 workflow，
# 所以 PR 还没合并之前用 push 触发同一份定义。

name: Release packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "验收用版本号（不会创建 tag、不会发布 Release）"
        required: false
        default: ""
  push:
    branches: ["feat/release-packaging"]

permissions:
  contents: read

env:
  LC_ALL: C
  TZ: UTC

jobs:
  prepare:
    name: version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: v
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ]; then v="0.0.0+g$(git rev-parse --short=7 HEAD)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "release version: $v (no tag is created)"

  server:
    name: build server (ubuntu:20.04, glibc 2.31)
    needs: prepare
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    defaults:
      run:
        shell: bash
    steps:
      - name: install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates g++ make libsqlite3-dev binutils file xz-utils python3
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: baseline report
        run: |
          . /etc/os-release; echo "build_os=$PRETTY_NAME"
          echo "build_glibc=$(ldd --version | head -1 | awk '{print $NF}')"
          g++ --version | head -1
      - name: build release artifacts (server)
        run: bash packaging/build-release.sh --version "${{ needs.prepare.outputs.version }}" --only server
      - name: ELF / glibc contract
        run: bash packaging/ci-elf-report.sh \
               dist/server/bin/backup-server dist/server/bin/backup-server-admin \
               dist/server/bin/backup-server-keygen dist/server/tools/backup-cert-tool
      - name: deb metadata
        run: |
          deb=$(ls dist/release/*/backup-project-server_*.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | head -30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-artifacts
          path: dist/release/*/backup-project-server*
          if-no-files-found: error

  client:
    name: build client (debian:12, Qt 6.4 / glibc 2.36)
    needs: prepare
    runs-on: ubuntu-24.04
    container: debian:12
    defaults:
      run:
        shell: bash
    steps:
      - name: install build tools + Qt6 + packaging tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates g++ make pkg-config binutils file xz-utils \
            python3 python3-pil \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev qt6-declarative-dev-tools \
            qt6-qpa-plugins qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-dialogs \
            qml6-module-qtquick-window qml6-module-qtquick-shapes qml6-module-qtqml-workerscript
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: baseline report
        run: |
          . /etc/os-release; echo "build_os=$PRETTY_NAME"
          echo "build_glibc=$(ldd --version | head -1 | awk '{print $NF}')"
          echo "qt=$(qmake6 -query QT_VERSION)"
      - name: build release artifacts (client)
        run: bash packaging/build-release.sh --version "${{ needs.prepare.outputs.version }}" --only client
      - name: AppImage content check
        run: |
          appimage=$(ls dist/release/*/Backup-Project-Client-*-x86_64.AppImage)
          echo "appimage=$appimage bytes=$(stat -c %s "$appimage")"
          cd /tmp && rm -rf ext && mkdir ext && cd ext
          "$GITHUB_WORKSPACE/$appimage" --appimage-extract > /dev/null
          echo "platforms: $(ls squashfs-root/usr/plugins/platforms 2>/dev/null | tr '\n' ' ')"
          echo "qml modules: $(ls squashfs-root/usr/qml 2>/dev/null | head -8 | tr '\n' ' ')"
          test -e squashfs-root/usr/plugins/platforms/libqxcb.so || { echo "缺少 xcb 平台插件"; exit 1; }
          test -e squashfs-root/usr/bin/backup-gui-modern || { echo "缺少 GUI"; exit 1; }
      - name: ELF / glibc contract
        run: bash packaging/ci-elf-report.sh dist/client/bin/backupctl dist/client/bin/backup-gui-modern
      - name: deb metadata
        run: |
          deb=$(ls dist/release/*/backup-project-client_*.deb)
          dpkg-deb --info "$deb"
          echo "--- 前 20 个文件 ---"
          dpkg-deb --contents "$deb" | head -20
          echo "--- 大小 ---"
          du -sh "$(ls -d dist/release/*/)"*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-artifacts
          path: |
            dist/release/*/Backup-Project-Client-*
            dist/release/*/backup-project-client*
          if-no-files-found: error

  bundle:
    name: bundle + clean-container install tests
    needs: [prepare, client, server]
    runs-on: ubuntu-24.04
    container: debian:12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: install tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates xz-utils file binutils python3 python3-pil             xvfb xauth libfuse2 qt6-qpa-plugins libxcb-cursor0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: client-artifacts
          path: incoming/client
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: server-artifacts
          path: incoming/server
      - name: assemble release directory
        run: |
          set -e
          version="${{ needs.prepare.outputs.version }}"
          out="dist/release/$version"
          mkdir -p "$out"
          cp -a incoming/client/. "$out"/
          cp -a incoming/server/. "$out"/
          ( cd "$out" && rm -f SHA256SUMS RELEASE-INFO.txt \
            && find . -maxdepth 1 -type f -printf '%P\n' | LC_ALL=C sort | xargs -r sha256sum > SHA256SUMS )
          cat "$out/SHA256SUMS"
          ( cd "$out" && sha256sum -c --quiet SHA256SUMS ) && echo "SHA256SUMS 自校验通过"
      - name: AppImage launch tests
        run: bash packaging/ci-appimage-test.sh "dist/release/${{ needs.prepare.outputs.version }}"
      - name: client deb install (clean debian:12)
        run: bash packaging/ci-client-install-test.sh "dist/release/${{ needs.prepare.outputs.version }}"
      - name: server deb install (clean debian:12, no systemd)
        run: bash packaging/ci-server-install-test.sh "dist/release/${{ needs.prepare.outputs.version }}"
      - name: secret scan on final artifacts
        run: bash packaging/ci-secret-scan.sh "dist/release/${{ needs.prepare.outputs.version }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle
          path: dist/release/**
          if-no-files-found: error
