name: Build Gantt PDF

on:
  push:
    branches:
      - docs/update-gantt-sprint-cycle
    paths:
      - docs/gantt/project_gantt.tex

permissions:
  contents: write

concurrency:
  group: build-gantt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Gantt PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: project_gantt.tex
          working_directory: docs/gantt
          latexmk_use_xelatex: true

      - name: Commit rebuilt PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/gantt/project_gantt.pdf
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: rebuild project gantt pdf"
          git push
