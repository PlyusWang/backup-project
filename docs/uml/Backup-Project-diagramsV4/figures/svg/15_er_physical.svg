<text x="47.0" y="665.0" text-anchor="start" font-family="Noto Sans CJK SC" font-size="18.0" font-weight="400" fill="#223044">显式索引：snapshots_by_user(user_id, created_at, id)；snapshots_by_parent(user_id, parent_id)</text>
<text x="47.0" y="690.2" text-anchor="start" font-family="Noto Sans CJK SC" font-size="18.0" font-weight="400" fill="#223044">users.username 与 snapshots.id 另有 SQLite 自动唯一索引；未定义数据库视图。</text>
<text x="47.0" y="715.4" text-anchor="start" font-family="Noto Sans CJK SC" font-size="18.0" font-weight="400" fill="#223044">parent_id → snapshots.id：仅业务关联，无 FOREIGN KEY、无 UNIQUE(parent_id) 物理约束。</text>
</svg>