<text x="1043.0" y="66.2" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="18.0" font-weight="700" fill="#223044">snapshots</text>
<text x="766.0" y="103.0" text-anchor="start" font-family="Noto Sans CJK SC" font-size="16.0" font-weight="400" fill="#223044">id TEXT PRIMARY KEY</text>
<text x="766.0" y="125.4" text-anchor="start" font-family="Noto Sans CJK SC" font-size="16.0" font-weight="400" fill="#223044">user_id INTEGER NOT NULL  [FK → users.id]</text>
