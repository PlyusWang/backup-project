# /etc/backup-project-server/server.conf
#
# backup-project-server 的配置。它由 /usr/bin/backup-project-server（启动器）
# 严格解析：key = value，# 之后是注释，未知键直接报错，值不做任何 shell 展开。
# 每个键都一对一映射到 backup-server 自己的命令行参数（见 backup-server --help），
# 启动器不发明任何产品语义。
#
# 改完先自检：
#   sudo backup-project-server --check-config
#   sudo systemctl restart backup-project-server
#
# 默认只监听 127.0.0.1：公网直连必须由管理员显式打开，并且要有证书与理由。
# 安装器不会碰 ufw / iptables / 云厂商安全组 —— 那是你的决定，不是我们的。

bind = 127.0.0.1
port = 18765

data_root = /var/lib/backup-project-server/data
database = /var/lib/backup-project-server/state/metadata.sqlite3
secret_file = /etc/backup-project-server/secrets.env
transport_key = /var/lib/backup-project-server/state/transport.key

# 服务器身份证书（BPCERT1，由离线根签发）。留空 = 只支持 BPSEC1 指纹模式。
certificate =

# 只接受 BPSEC2（签名身份）客户端。公网绑定时必须为 true。
require_bpsec2 = false

# 公网绑定：必须同时给出 certificate、reason 与 require_bpsec2 = true。
# 打开它之前先想清楚：18765 会直接暴露在互联网上。
allow_public_bind = false
public_bind_reason =
# 逃生舱（不推荐）：公网绑定 + BPSEC1 指纹模式。启动器会大声警告。
allow_public_bind_insecure = false

log_file =
pid_file = /run/backup-project-server/backup-server.pid

workers = 4
io_timeout = 30
max_upload_bytes = 8589934592
max_login_failures = 5
login_lockout_seconds = 60
quiet = false
